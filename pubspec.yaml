name: ps5_99
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  auto_route: ^7.9.2
  bloc_test: ^9.1.7
  cached_network_image: ^3.3.1
  change_app_package_name: ^1.2.0
  chucker_flutter: ^1.7.2
  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.4.3+1
  easy_localization: ^3.0.7
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_dotenv: ^5.1.0
  flutter_native_splash: ^2.4.0
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.1
  get_it: ^7.7.0
  html: ^0.15.4
  infinite_scroll_pagination: ^4.0.0
  injectable: ^2.4.2
  json_annotation: ^4.9.0
  melos: ^6.0.0
  rename_app: ^1.4.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0

dev_dependencies:
  auto_route_generator: ^7.3.2
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.4.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  injectable_generator: ^2.6.1
  json_serializable: ^6.8.0
  lint: ^2.3.0
  mockito: ^5.4.4

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true

  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
      class_name: AppAssets
  fonts:
    enabled: true
    outputs:
      class_name: AppFonts
  colors:
    enabled: true
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors

flutter:
  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
          style: normal
        - asset: assets/fonts/OpenSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/OpenSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/OpenSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/OpenSans-LightItalic.ttf
          weight: 300
          style: italic

  uses-material-design: true